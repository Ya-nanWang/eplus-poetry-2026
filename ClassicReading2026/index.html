<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经典诵读：凌空诗境</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        /* --- 基础样式 --- */
        body { margin: 0; padding: 0; background-color: #111; overflow: hidden; font-family: 'KaiTi', '楷体', serif; user-select: none; }

        /* --- 加载层 --- */
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); color: #d4af37; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 2000; transition: opacity 1s;
        }
        #skip-btn {
            margin-top: 20px; padding: 8px 20px; border: 1px solid #d4af37; 
            color: #d4af37; background: transparent; cursor: pointer; display: none;
        }

        /* --- 视差背景容器 --- */
        #gallery-container {
            position: absolute; top: 0; left: 0; height: 100vh; width: 135vw; /* 适配宽图 */
            transform-origin: center center; 
            will-change: transform; /* 性能优化 */
        }

        #bg-image {
            width: 100%; height: 100%; object-fit: cover;
            background-image: url('background.png'); 
            background-position: center; background-size: cover;
            filter: brightness(0.65) contrast(1.1); 
        }

        /* --- 星星样式 (自动呼吸) --- */
        .star {
            position: absolute; width: 60px; height: 60px;
            /* 金色光晕 */
            background: radial-gradient(circle, rgba(255,255,255,1) 10%, rgba(255,215,0,0.8) 40%, transparent 70%);
            border-radius: 50%; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            color: #fff; font-size: 14px; font-weight: bold;
            text-shadow: 0 0 5px #000;
            margin-left: -30px; margin-top: -30px;
            /* 默认呼吸动画 */
            animation: breathe 3s infinite ease-in-out;
            transition: all 0.3s ease;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
            50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 30px rgba(212, 175, 55, 0.5); }
        }

        /* 播放时的激活状态 (更亮、更大) */
        .star.playing {
            transform: scale(1.4) !important; /* 强制放大 */
            box-shadow: 0 0 60px #d4af37, 0 0 100px rgba(212, 175, 55, 0.5);
            background: radial-gradient(circle, #fff 20%, #ffd700 50%, transparent 80%);
            z-index: 100;
            animation: none; /* 停止呼吸，保持高亮 */
        }

        /* --- 粒子层 --- */
        #particle-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 800; 
        }

        /* --- 手势光晕 --- */
        #magic-cursor {
            position: fixed; width: 40px; height: 40px;
            border: 2px solid #d4af37; background: rgba(255, 215, 0, 0.2);
            border-radius: 50%; pointer-events: none; z-index: 950;
            transform: translate(-50%, -50%); box-shadow: 0 0 30px #d4af37;
            display: none; 
        }

        /* --- 底部控制条 --- */
        #controls {
            position: fixed; bottom: 40px; width: 100%; text-align: center;
            color: #d4af37; z-index: 1500; font-size: 20px; 
            text-shadow: 0 2px 4px black; pointer-events: none;
            opacity: 0; transition: opacity 0.5s;
        }
        .input_video { display: none; }
    </style>
</head>
<body>

    <div id="loading">
        <h1 id="loading-text">凌空诗境 · 正在开启</h1>
        <p>如摄像头未启动，可直接点击“跳过”进入</p>
        <button id="skip-btn" onclick="forceStart()">跳过等待，直接进入</button>
    </div>
    
    <video class="input_video"></video>
    <canvas id="particle-canvas"></canvas>

    <div id="gallery-container">
        <div id="bg-image">
            <div class="star" data-audio="s1.mp3" style="left: 10%; top: 35%;">同学1</div>
            <div class="star" data-audio="s2.mp3" style="left: 20%; top: 55%;">同学2</div>
            <div class="star" data-audio="s3.mp3" style="left: 28%; top: 25%;">同学3</div>
            <div class="star" data-audio="s4.mp3" style="left: 38%; top: 65%;">同学4</div>
            <div class="star" data-audio="s5.mp3" style="left: 45%; top: 40%;">同学5</div>
            <div class="star" data-audio="s6.mp3" style="left: 55%; top: 30%;">同学6</div>
            <div class="star" data-audio="s7.mp3" style="left: 65%; top: 60%;">同学7</div>
            <div class="star" data-audio="s8.mp3" style="left: 72%; top: 20%;">同学8</div>
            <div class="star" data-audio="s9.mp3" style="left: 80%; top: 70%;">同学9</div>
            <div class="star" data-audio="s10.mp3" style="left: 88%; top: 45%;">同学10</div>
            <div class="star" data-audio="s11.mp3" style="left: 95%; top: 35%;">同学11</div>
        </div>
    </div>

    <div id="magic-cursor"></div>
    <div id="controls">正在吟诵：<span id="current-reader" style="font-weight:bold; border-bottom: 1px solid #d4af37;">...</span></div>

    <audio id="bg-music"></audio>

    <script>
        // --- 核心变量 ---
        const videoElement = document.getElementsByClassName('input_video')[0];
        const gallery = document.getElementById('gallery-container');
        const cursor = document.getElementById('magic-cursor');
        const loading = document.getElementById('loading');
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        const audioEl = document.getElementById('bg-music');
        const readerDisplay = document.getElementById('current-reader');
        const controlPanel = document.getElementById('controls');

        // --- 1. 容错加载逻辑 ---
        setTimeout(() => { 
            if(loading.style.display !== 'none') {
                document.getElementById('skip-btn').style.display = 'block';
            }
        }, 3000); // 3秒没加载完就显示跳过按钮

        function forceStart() { 
            loading.style.opacity = 0; 
            setTimeout(() => { loading.style.display = 'none'; }, 1000); 
        }

        // --- 2. 粒子特效系统 (含点击爆炸效果) ---
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

        let particles = [];
        class Particle {
            constructor(x, y, type = 'ambient') {
                this.type = type; // 'ambient' (环境) 或 'burst' (爆炸)
                this.x = x || Math.random() * canvas.width;
                this.y = y || Math.random() * canvas.height;
                
                if (type === 'burst') {
                    // 爆炸粒子：金色，向四周扩散
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 3 + 2;
                    this.speedX = Math.cos(angle) * speed;
                    this.speedY = Math.sin(angle) * speed;
                    this.size = Math.random() * 4 + 2;
                    this.life = 100; // 生命值
                    this.opacity = 1;
                } else {
                    // 环境粒子：慢速漂浮
                    this.speedX = Math.random() * 0.5 - 0.25;
                    this.speedY = Math.random() * -0.5 - 0.2; // 缓慢向上
                    this.size = Math.random() * 2 + 1;
                    this.opacity = Math.random() * 0.5 + 0.1;
                }
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.type === 'burst') {
                    this.life -= 1.5;
                    this.opacity = this.life / 100;
                    this.size *= 0.96; 
                } else {
                    if (this.y < 0) { this.y = canvas.height + 10; this.x = Math.random() * canvas.width; }
                }
            }
            draw() {
                if (this.opacity <= 0) return;
                ctx.fillStyle = `rgba(255, 215, 0, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 初始化环境粒子
        for(let i=0; i<60; i++) particles.push(new Particle());

        // 生成爆炸效果的函数
        function spawnExplosion(x, y) {
            for(let i=0; i<30; i++) { // 每次点击产生30个粒子
                particles.push(new Particle(x, y, 'burst'));
            }
        }

        // --- 3. 动画与手势循环 ---
        let targetX = 0, currentX = 0;
        let targetScale = 1.0, currentScale = 1.0;
        
        function getMaxScroll() { return gallery.offsetWidth - window.innerWidth; }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 更新绘制粒子
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                // 移除死掉的爆炸粒子
                if (particles[i].type === 'burst' && particles[i].life <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }

            // 平滑移动背景
            currentX += (targetX - currentX) * 0.08;
            currentScale += (targetScale - currentScale) * 0.05;
            gallery.style.transform = `translateX(${currentX}px) scale(${currentScale})`;

            requestAnimationFrame(animate);
        }
        animate();

        // --- 4. 交互逻辑 (点击星星) ---
        document.querySelectorAll('.star').forEach(star => {
            star.addEventListener('click', function(e) {
                // 获取点击位置，产生粒子爆炸
                const rect = this.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                spawnExplosion(centerX, centerY);

                // 播放逻辑
                const audioFile = this.getAttribute('data-audio');
                const studentName = this.innerText;

                // 重置所有星星状态
                document.querySelectorAll('.star').forEach(s => s.classList.remove('playing'));
                
                // 激活当前星星
                this.classList.add('playing');
                
                // 显示名字
                controlPanel.style.opacity = 1;
                readerDisplay.innerText = studentName;

                // 播放音频
                audioEl.src = audioFile;
                audioEl.play().catch(err => {
                    console.error("播放失败", err);
                    alert("未找到音频文件: " + audioFile + "\n请确保文件已放入文件夹并重命名。");
                });
            });
        });

        // --- 5. AI 手势识别 (带容错) ---
        function onResults(results) {
            if(loading.style.display !== 'none') forceStart(); // 识别成功则直接进入

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const lm = results.multiHandLandmarks[0][8]; // 食指尖
                const cursorX = (1 - lm.x) * window.innerWidth;
                const cursorY = lm.y * window.innerHeight;
                
                // 更新光晕
                cursor.style.display = 'block';
                cursor.style.left = `${cursorX}px`; 
                cursor.style.top = `${cursorY}px`;
                
                // 计算滚动
                const maxScroll = getMaxScroll();
                if (maxScroll > 0) {
                    // 限制范围防止抖动
                    targetX = -1 * (1 - lm.x) * maxScroll;
                }
                
                // 计算缩放 (向上放大，向下缩小)
                targetScale = 1.3 - (lm.y * 0.4);
            } else {
                cursor.style.display = 'none';
            }
        }

        // 初始化 MediaPipe
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 1280, height: 720
        });

        // 尝试启动摄像头，失败也不报错，直接允许使用鼠标点击
        camera.start().catch(e => {
            console.warn("摄像头启动受限，已切换至点击模式");
            loading.querySelector('p').innerText = "未检测到摄像头，请直接点击星星互动";
            document.getElementById('skip-btn').style.display = 'block';
        });

    </script>
</body>
</html>
